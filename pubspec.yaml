name: prashant
description: Prashant - Student Productivity + Social Study Community
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=2.18.0 <3.0.0'
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.10.0
  firebase_auth: ^4.3.0
  cloud_firestore: ^4.6.0
  firebase_messaging: ^14.3.0
  cloud_functions: ^4.1.0
  provider: ^6.0.5
  firebase_storage: ^11.1.0
  image_picker: ^0.8.7+3
  shared_preferences: ^2.1.1
  flutter_local_notifications: ^13.0.0
  uuid: ^3.0.7
  charts_flutter: ^0.12.0
  intl: ^0.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
